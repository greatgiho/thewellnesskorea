name: Reverse-sync greatgiho → great (open PR)

# greatgiho/main(=giho의 프로덕션 tip)에 great/dev 에 없는 변경이 있으면,
# SHA 보존으로 great/dev 에 역반영하는 PR을 자동으로 연다.
# 머지는 사람이 리뷰 후 수행(직접 push 아님). forward 미러와 달리 PAT 불필요
# (greatgiho는 public이라 읽기 무인증, great push/PR은 기본 GITHUB_TOKEN).
#
# 감지는 SHA가 아니라 "내용(trial merge)" 기준 → 이전 PR을 squash/rebase로
# 머지해 원본 SHA가 dev 이력에 없어도 재감지(중복 PR)하지 않는다.
on:
  schedule:
    # 시간은 UTC. KST = UTC+9.
    - cron: "0 21 * * *"     # 06:00 KST (아침)
    - cron: "0 13 * * *"     # 22:00 KST (밤)
    - cron: "0,30 3-9 * * *" # 일과: 12:00–18:30 KST, 30분마다
    - cron: "0 10 * * *"     # 19:00 KST (일과 끝)
  workflow_dispatch: {}

concurrency:
  group: reverse-sync-greatgiho
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  reverse-sync:
    # 미러본이 greatgiho로 딸려가도 거기서 돌지 않도록 원본에서만 실행
    if: github.repository == 'great/TheWellnessKorea'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout great/dev (full history)
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Fetch greatgiho/main (public, 무인증)
        run: |
          git remote add greatgiho https://github.com/greatgiho/thewellnesskorea.git
          git fetch --no-tags greatgiho main

      - name: Open reverse-sync PR if greatgiho has changes not in great/dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # 이미 열린 역방향 PR이 있으면 중복 생성하지 않음
          OPEN=$(gh pr list --state open --base dev --json headRefName \
                  --jq '[.[].headRefName | select(startswith("reverse-sync/"))] | length')
          if [ "$OPEN" -gt 0 ]; then
            echo "이미 열린 reverse-sync PR 존재 — 스킵(먼저 처리 필요)."; exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BR="reverse-sync/greatgiho-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BR"
          SUMMARY=$(git log --oneline --no-merges HEAD..greatgiho/main | sed 's/^/- /')

          # 내용 기준 판정: trial merge 결과 파일 변경이 없으면(=이미 반영, squash 포함)
          # 아무것도 안 한다. 변경이 있으면 그 머지로 PR을 연다.
          if git merge --no-ff --no-commit greatgiho/main >/dev/null 2>&1; then
            if git diff --cached --quiet; then
              echo "내용 이미 동기화됨(SHA가 달라도) — PR 불필요."
              git merge --abort 2>/dev/null || git reset --hard HEAD
              exit 0
            fi
            git commit -m "Reverse-sync greatgiho/main → great/dev"
            git push origin "$BR"
            gh pr create --base dev --head "$BR" \
              --title "Reverse-sync: greatgiho/main → great/dev" \
              --body "$(printf 'greatgiho/main 에 great/dev 에 없는 변경이 있어 자동 생성된 역방향 동기화 PR입니다(SHA 보존 머지).\n\n%s\n\n- ⚠️ 새 마이그레이션 포함 여부(예: 033) 확인 후 DB 반영.\n- 병합 방식(merge/squash) 무관 — 다음 실행은 내용 기준이라 재감지하지 않음.' "$SUMMARY")"
          else
            # 충돌 시: 자동 해결하지 않고 원본 tip 브랜치로 PR을 열어 사람이 GitHub에서 해결
            git merge --abort 2>/dev/null || git reset --hard HEAD
            SHA=$(git rev-parse greatgiho/main)
            git push origin "$SHA:refs/heads/$BR"
            gh pr create --base dev --head "$BR" \
              --title "⚠️ [conflicts] Reverse-sync: greatgiho/main → great/dev" \
              --body "$(printf '자동 머지에서 **충돌**이 발생했습니다. GitHub PR에서 수동 해결하거나 로컬에서 머지하세요.\n\n%s' "$SUMMARY")"
          fi
