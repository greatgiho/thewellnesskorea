name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0" # keep in sync with mise.toml
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build
        env:
          # Pages are dynamic (Supabase server client reads cookies), so the
          # build does not query the DB. Placeholders satisfy module-level
          # env reads; set real values as repo secrets if a build ever needs them.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
