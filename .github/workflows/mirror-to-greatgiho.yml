name: Mirror main → greatgiho

# great(원본)의 main이 갱신되면 greatgiho(다운스트림 미러)의 main으로 push한다.
# 필요 시 수동 트리거(workflow_dispatch)도 가능.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# 동시에 여러 번 돌지 않게(중복 push 방지)
concurrency:
  group: mirror-to-greatgiho
  cancel-in-progress: false

jobs:
  mirror:
    # 미러본이 greatgiho로 딸려간 뒤 거기서 다시 돌지 않도록 원본에서만 실행
    if: github.repository == 'great/TheWellnessKorea'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # GITHUB_TOKEN을 git config에 심지 않게 — 안 그러면 push URL의 PAT를
          # 덮어써 github-actions[bot]로 push되어 greatgiho에 403이 난다.
          persist-credentials: false

      - name: Push main to greatgiho (fast-forward only)
        env:
          SYNC_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git push "https://x-access-token:${SYNC_TOKEN}@github.com/greatgiho/thewellnesskorea.git" HEAD:main
          echo "Synced $(git rev-parse --short HEAD) → greatgiho/main"
